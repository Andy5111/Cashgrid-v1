<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHGRID V1</title>
<style>
:root {--pink:#FF69B4; --brown:#8B4513; --light:#F5FFF8; --white:#fff; --green:#00C853; --shadow:0 4px 12px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--light)}
.container{max-width:900px;margin:0 auto;padding:15px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--white);border-radius:16px;padding:30px;max-width:400px;width:100%;box-shadow:var(--shadow)}
.input{width:100%;padding:14px;margin:10px 0;border:1.5px solid #ddd;border-radius:10px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer}
.btn-pink{background:var(--pink);color:white}
.btn-green{background:var(--green);color:white}
.assets-card{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);border-radius:20px;padding:20px;margin:15px 0}
.assets-amount{font-size:28px;font-weight:800;color:var(--green)}
.btn-deposit{background:linear-gradient(90deg,#00E676,#00C853);color:white;border:none;padding:14px 30px;border-radius:50px;font-weight:800;cursor:pointer}
.section-title{color:var(--brown);font-size:18px;font-weight:800;margin:20px 0 12px}
.miner-list{display:flex;flex-direction:column;gap:16px}
.miner-card{background:var(--white);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.miner-top{display:flex;gap:14px}
.miner-img{width:110px;height:110px;object-fit:cover;border-radius:10px}
.price{font-size:18px;font-weight:800;color:var(--green)}
.btn-invest{background:linear-gradient(90deg,#00C853,#00E676);color:white;border:none;padding:11px 24px;border-radius:25px;font-weight:800;cursor:pointer}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999}
.modal-content{background:white;padding:25px;border-radius:16px;width:90%;max-width:400px}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="authPage" class="auth-wrap">
<div class="auth-card">
<h1 style="color:var(--brown);text-align:center">CASHGRID V1</h1>
<input id="email" placeholder="Email" class="input">
<input id="password" type="password" placeholder="Password" class="input">
<button onclick="login()" class="btn btn-pink">Login</button>
</div>
</div>

<div id="dashboardPage" class="hidden">
<div class="container">
  <h2 style="color:var(--brown)">Dashboard</h2>
  <div class="assets-card">
    <div>Total Assets</div>
    <div class="assets-amount">₦<span id="totalAssets">0.00</span></div>
    <button class="btn-deposit" onclick="openDeposit()">Deposit</button>
  </div>
  <div class="section-title">Mining Machines</div>
  <div class="miner-list" id="minersGrid"></div>
</div>
</div>

<div id="depositModal" class="modal hidden">
  <div class="modal-content">
    <h3>Deposit Funds</h3>
    <input id="depositAmt" type="number" min="5000" placeholder="Min ₦5000" class="input">
    <button onclick="deposit()" class="btn btn-green">Pay with Payhub</button>
    <button onclick="closeModal()" class="btn">Cancel</button>
  </div>
</div>

<script>
const API_URL = "https://cashgrid-v1.onrender.com"

const MINERS = [
 {id:1,name:"ChineMiner S1",price:5000,daily:500,total:10000,img:"https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=400"},
 {id:2,name:"ChineMiner S2",price:10000,daily:1000,total:20000,img:"https://images.unsplash.com/photo-1518770660439-4636190af475?w=400"},
 {id:3,name:"ChineMiner S3",price:30000,daily:3000,total:60000,img:"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=400"},
 {id:4,name:"ChineMiner S4",price:70000,daily:7000,total:140000,img:"https://images.unsplash.com/photo-1621761191319-c6fb62004040?w=400"},
 {id:5,name:"ChineMiner S5",price:120000,daily:12000,total:240000,img:"https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400"},
 {id:6,name:"ChineMiner S6",price:200000,daily:20000,total:400000,img:"https://images.unsplash.com/photo-1548092372-0d1bd40894a3?w=400"},
 {id:7,name:"ChineMiner S7 Pro",price:300000,daily:30000,total:600000,img:"https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=400"}
]

function openDeposit(){depositModal.classList.remove('hidden')}
function closeModal(){depositModal.classList.add('hidden')}

async function login(){
  localStorage.setItem('currentUser', email.value);
  authPage.classList.add('hidden');dashboardPage.classList.remove('hidden');
  renderMiners();
}

async function deposit(){
  let amt=parseInt(depositAmt.value);if(amt<5000)return alert("Min ₦5000");
  let ref = 'CM_' + Date.now();
  const res = await fetch(`${API_URL}/api/create-payment`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({email: localStorage.getItem('currentUser'), amount: amt, reference: ref})
  });
  const data = await res.json();
  if(data.payment_url){ window.location.href = data.payment_url; } 
  else { alert('Error: ' + JSON.stringify(data)) }
}

function renderMiners(){
  minersGrid.innerHTML=MINERS.map(m=>`
    <div class="miner-card">
      <div class="miner-top">
        <img src="${m.img}" class="miner-img">
        <div>
          <div style="font-weight:800">${m.name}</div>
          <div>Daily: ₦${m.daily.toLocaleString()}</div>
          <div>Total: ₦${m.total.toLocaleString()}</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:12px">
        <div class="price">₦${m.price.toLocaleString()}</div>
        <button onclick="alert('Buy '+m.name)" class="btn-invest">Invest</button>
      </div>
    </div>
  `).join('')
}
</script>
</body>
</html>
