<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHGRID - Invest & Earn</title>
<script src="https://checkout.payhub.com.ng/v1.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    body{background:#0a0a0a;color:#fff}
    .container{max-width:500px;margin:0 auto;padding:20px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .logo{font-size:24px;font-weight:800;color:#00ff88}
    .balance-card{background:linear-gradient(135deg,#00ff88,#00cc6a);padding:20px;border-radius:15px;margin-bottom:20px}
    .balance-amount{font-size:32px;font-weight:800}
    .btn{background:#ffd700;color:#000;border:none;padding:12px 20px;border-radius:10px;font-weight:700;width:100%;margin-top:10px;cursor:pointer}
    .btn-red{background:#ff4444;color:#fff}
    .tabs{display:flex;gap:10px;overflow-x:auto;margin-bottom:20px}
    .tab{padding:10px 15px;background:#1a1a1a;border-radius:8px;cursor:pointer;white-space:nowrap}
    .tab.active{background:#00ff88;color:#000}
    .card{background:#1a1a1a;padding:15px;border-radius:12px;margin-bottom:15px}
    input{width:100%;padding:12px;background:#2a2a2a;border:1px solid #333;border-radius:8px;color:#fff;margin-top:8px}
    .admin-badge{background:#ffd700;color:#000;padding:3px 8px;border-radius:5px;font-size:12px}
    .stat-card{background:#2a2a2a;padding:15px;border-radius:10px;text-align:center}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">CASHGRID</div>
        <div id="userInfo"></div>
    </div>

    <div id="auth">
        <h2>Login</h2>
        <input id="loginEmail" placeholder="Email">
        <input id="loginPass" type="password" placeholder="Password">
        <button class="btn" onclick="login()">Login</button>
        <p style="margin-top:10px">No account? <a onclick="showRegister()" style="color:#00ff88;cursor:pointer">Register</a></p>
    </div>

    <div id="app" style="display:none">
        <div class="balance-card">
            <div>Main Balance</div>
            <div class="balance-amount" id="balance">₦0</div>
            <div style="margin-top:10px">Profit: ₦<span id="profit">0</span> | Bonus: ₦<span id="bonus">0</span></div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="showTab('dashboard')">Dashboard</div>
            <div class="tab" onclick="showTab('deposit')">Deposit</div>
            <div class="tab" onclick="showTab('withdraw')">Withdraw</div>
            <div class="tab" onclick="showTab('history')">History</div>
            <div class="tab" onclick="showTab('referrals')">Referrals</div>
            <div class="tab" id="adminTabBtn" style="display:none" onclick="showTab('admin')">Admin</div>
        </div>

        <div id="dashboard" class="tab-content">
            <button class="btn" onclick="showTab('deposit')">Deposit</button>
            <button class="btn btn-red" onclick="showTab('withdraw')">Withdraw</button>
        </div>

        <div id="deposit" class="tab-content" style="display:none">
            <div class="card">
                <h3>Deposit Funds</h3>
                <input id="depositAmount" type="number" placeholder="Min ₦1000">
                <button class="btn" onclick="submitDeposit()">Pay with Payhub</button>
            </div>
        </div>

        <div id="withdraw" class="tab-content" style="display:none">
            <div class="card">
                <h3>Withdraw Funds</h3>
                <input id="withdrawAmount" type="number" placeholder="Amount">
                <input id="bankName" placeholder="Bank Name">
                <input id="accountNumber" placeholder="Account Number">
                <input id="accountName" placeholder="Account Name">
                <button class="btn btn-red" onclick="submitWithdraw()">Request Withdrawal</button>
            </div>
        </div>

        <div id="history" class="tab-content" style="display:none">
            <div id="historyList"></div>
        </div>

        <div id="referrals" class="tab-content" style="display:none">
            <div class="card">
                <h3>Your Referral Link</h3>
                <input id="refLink" readonly>
            </div>
        </div>

        <div id="admin" class="tab-content" style="display:none">
            <div id="adminStats" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px"></div>
            <h3>Pending Withdrawals</h3>
            <div id="pendingList"></div>
            <h3 style="margin-top:20px">All Users</h3>
            <div id="usersList"></div>
        </div>
    </div>
</div>

<script>
const API_URL = 'https://cashgrid-v1.onrender.com';
const PAYHUB_PUBLIC_KEY = 'pk_live_1fbd5dc52d169275428c772970474ebb';
let currentUser = null;
let users = [];

function showTab(tab){
    document.querySelectorAll('.tab-content').forEach(e=>e.style.display='none');
    document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
    document.getElementById(tab).style.display='block';
    event.target.classList.add('active');
    if(tab==='admin') loadAdmin();
    if(tab==='history') loadHistory();
}

async function login(){
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPass').value;
    const res = await fetch(`${API_URL}/api/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data = await res.json();
    if(data.user){
        currentUser = data.user;
        document.getElementById('auth').style.display='none';
        document.getElementById('app').style.display='block';
        document.getElementById('userInfo').innerHTML = email === 'andrewdauda555@gmail.com' ? 'ADMIN <span class="admin-badge">ADMIN MODE</span>' : email;
        if(email === 'andrewdauda555@gmail.com') document.getElementById('adminTabBtn').style.display='block';
        loadUserData();
    } else alert(data.message);
}

async function loadUserData(){
    const res = await fetch(`${API_URL}/api/user/${currentUser._id}`);
    const data = await res.json();
    document.getElementById('balance').innerText = '₦' + (data.balance || 0).toLocaleString();
    document.getElementById('profit').innerText = (data.profit || 0).toLocaleString();
    document.getElementById('bonus').innerText = (data.bonus || 0).toLocaleString();
    document.getElementById('refLink').value = window.location.origin + '?ref=' + currentUser._id;
}

// 1. DEPOSIT = AUTO VIA PAYHUB
function submitDeposit(){
    const amount = document.getElementById('depositAmount').value;
    if(!amount || amount < 1000) return alert('Min deposit is ₦1000');
    const handler = PayhubPop.setup({
        publicKey: PAYHUB_PUBLIC_KEY,
        email: currentUser.email,
        amount: amount * 100,
        currency: 'NGN',
        ref: 'CG_' + Date.now(),
        callback: function(response){
            saveDeposit(currentUser._id, amount, 'approved', response.reference);
        },
        onClose: function(){ alert('Payment cancelled'); }
    });
    handler.openIframe();
}

async function saveDeposit(userId, amount, status, ref){
    await fetch(`${API_URL}/api/deposit`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({userId, amount, status, reference: ref})
    });
    alert('Deposit Successful! ₦' + amount + ' added');
    loadUserData();
    showTab('dashboard');
}

// 2. WITHDRAW = PENDING ADMIN
async function submitWithdraw(){
    const amount = document.getElementById('withdrawAmount').value;
    const bankName = document.getElementById('bankName').value;
    const accountNumber = document.getElementById('accountNumber').value;
    const accountName = document.getElementById('accountName').value;
    if(!amount || !bankName || !accountNumber) return alert('Fill all fields');
    await fetch(`${API_URL}/api/withdraw`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({userId: currentUser._id, amount, bankName, accountNumber, accountName, status: 'pending'})
    });
    alert('Withdrawal request submitted! Waiting for admin approval');
    showTab('dashboard');
}

// 3. ADMIN PANEL WITH TOTALS
async function loadAdmin(){
    const res = await fetch(`${API_URL}/api/admin/users`);
    users = await res.json();
    
    const totalDeposited = users.reduce((sum, u) => sum + (u.totalDeposited || 0), 0);
    const totalWithdrawn = users.reduce((sum, u) => sum + (u.totalWithdrawn || 0), 0);
    
    document.getElementById('adminStats').innerHTML = `
        <div class="stat-card">Total Deposited<br><b>₦${totalDeposited.toLocaleString()}</b></div>
        <div class="stat-card">Total Withdrawn<br><b>₦${totalWithdrawn.toLocaleString()}</b></div>
    `;

    document.getElementById('usersList').innerHTML = users.map(u=>`
        <div class="card">${u.email} - Bal: ₦${u.balance}</div>
    `).join('');

    const wRes = await fetch(`${API_URL}/api/admin/withdrawals`);
    const withdrawals = await wRes.json();
    document.getElementById('pendingList').innerHTML = withdrawals.filter(w=>w.status==='pending').map(w=>`
        <div class="card">${w.userId.email} - ₦${w.amount}
        <button class="btn" onclick="approveWithdraw('${w._id}')">Approve</button>
        </div>
    `).join('');
}

async function approveWithdraw(id){
    await fetch(`${API_URL}/api/admin/withdraw/approve/${id}`,{method:'POST'});
    alert('Withdrawal Approved');
    loadAdmin();
}

async function loadHistory(){
    const res = await fetch(`${API_URL}/api/history/${currentUser._id}`);
    const data = await res.json();
    document.getElementById('historyList').innerHTML = data.map(h=>`
        <div class="card">${h.type} - ₦${h.amount} - <span style="color:${h.status==='approved'?'#00ff88':'#ffd700'}">${h.status}</span></div>
    `).join('');
}
</script>
</body>
  </html>
