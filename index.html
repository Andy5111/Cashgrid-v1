<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CashGrid - Crypto Mining</title>
<script src="https://js.paystack.co/v2/inline.js"></script>
<style>
body{font-family:Arial;background:#0a0a0a;color:#fff;margin:0;padding:20px}
.card{background:#1a1a1a;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #333}
.btn{background:#00ff88;color:#000;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;margin:5px}
.btn:disabled{background:#555}
input{width:90%;padding:10px;margin:5px 0;border-radius:5px;border:1px solid #333;background:#222;color:#fff}
.hidden{display:none}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-content{background:#1a1a1a;padding:20px;border-radius:10px;width:90%;max-width:400px}
</style>
</head>
<body>

<div id="auth">
 <h2>CashGrid Login</h2>
 <input id="email" placeholder="Email">
 <input id="password" type="password" placeholder="Password">
 <button class="btn" onclick="login()">Login</button>
 <button class="btn" onclick="register()">Register</button>
</div>

<div id="dashboard" class="hidden">
 <h2>Welcome to CashGrid</h2>
 <div class="card">
   <h3>Balance: ₦<span id="balance">0</span></h3>
   <button class="btn" onclick="showDeposit()">Deposit</button>
   <button class="btn" onclick="showWithdraw()">Withdraw</button>
 </div>

 <div class="card">
   <h3>Buy Miner</h3>
   <p>Miner 1: ₦5000 → ₦500/day for 20 days</p>
   <button class="btn" onclick="buyMiner(1,5000)">Buy Miner 1</button>
   <p>Miner 2: ₦10000 → ₦1000/day for 20 days</p>
   <button class="btn" onclick="buyMiner(2,10000)">Buy Miner 2</button>
 </div>

 <div class="card">
   <h3>Transactions</h3>
   <div id="transactions">Loading...</div>
 </div>
</div>

<!-- DEPOSIT MODAL -->
<div id="depositModal" class="modal hidden">
 <div class="modal-content">
   <h3>Deposit with Paystack</h3>
   <input id="depositAmount" type="number" placeholder="Min ₦5000">
   <button class="btn" onclick="payWithPaystack()">Pay Now</button>
   <button class="btn" onclick="closeDeposit()">Cancel</button>
 </div>
</div>

<!-- WITHDRAW MODAL -->
<div id="withdrawModal" class="modal hidden">
 <div class="modal-content">
   <h3>Withdraw - 18% Tax</h3>
   <p>Rule: You must Deposit + Buy Miner first</p>
   <input id="wAmount" type="number" placeholder="Amount Min ₦1000">
   <input id="wBank" placeholder="Bank Name">
   <input id="wAccount" placeholder="Account Number">
   <input id="wName" placeholder="Account Name">
   <button class="btn" onclick="requestWithdraw()">Submit Request</button>
   <button class="btn" onclick="closeWithdraw()">Cancel</button>
 </div>
</div>

<script>
const API = 'https://your-render-url.onrender.com/api'; // WE WILL CHANGE THIS AFTER DEPLOY
let token = localStorage.getItem('token');
let data = {}; // to store user data

if(token) loadDashboard();

async function api(url,method='GET',body=null){
 const res = await fetch(API+url,{
   method,
   headers:{'Content-Type':'application/json','Authorization':token},
   body: body?JSON.stringify(body):null
 });
 return res.json();
}

async function register(){
 const email = document.getElementById('email').value;
 const password = document.getElementById('password').value;
 const res = await api('/register','POST',{email,password});
 if(res.token){token=res.token;localStorage.setItem('token',token);loadDashboard();}
 else alert(res.msg);
}

async function login(){
 const email = document.getElementById('email').value;
 const password = document.getElementById('password').value;
 const res = await api('/login','POST',{email,password});
 if(res.token){token=res.token;localStorage.setItem('token',token);loadDashboard();}
 else alert(res.msg);
}

async function loadDashboard(){
 document.getElementById('auth').classList.add('hidden');
 document.getElementById('dashboard').classList.remove('hidden');
 data = await api('/me'); // STORE USER DATA HERE
 document.getElementById('balance').innerText = data.balance;
 let txHtml = data.transactions.map(t=>`<p>${t.type} ₦${t.amount} - ${t.status} - ${t.note}</p>`).join('');
 document.getElementById('transactions').innerHTML = txHtml;
}

// PAYSTACK
function showDeposit(){document.getElementById('depositModal').classList.remove('hidden')}
function closeDeposit(){document.getElementById('depositModal').classList.add('hidden')}

async function payWithPaystack(){
 const amount = document.getElementById('depositAmount').value;
 const res = await api('/paystack/init','POST',{amount});
 if(res.url){
   const handler = PaystackPop.setup({
     key: 'pk_test_d9f28dadb81148cebc6ea0e9c4dbb72302b43f87', // YOUR PUBLIC KEY
     email: data.email, // USES LOGGED IN USER EMAIL
     amount: amount*100,
     ref: res.reference,
     callback: async function(response){
       await api('/paystack/verify','POST',{reference:response.reference});
       alert('Deposit successful');
       closeDeposit();
       loadDashboard();
     },
     onClose: function(){alert('Payment cancelled')}
   });
   handler.openIframe();
 } else {alert(res.msg)}
}

// WITHDRAW
function showWithdraw(){document.getElementById('withdrawModal').classList.remove('hidden')}
function closeWithdraw(){document.getElementById('withdrawModal').classList.add('hidden')}

async function requestWithdraw(){
 const amount = document.getElementById('wAmount').value;
 const bank = document.getElementById('wBank').value;
 const account = document.getElementById('wAccount').value;
 const name = document.getElementById('wName').value;
 const res = await api('/withdraw','POST',{amount,bank,account,name});
 alert(res.msg);
 closeWithdraw();
 loadDashboard();
}

async function buyMiner(id,price){
 const res = await api('/buy-miner','POST',{minerId:id,price});
 alert(res.msg);
 loadDashboard();
}
</script>
</body>
</html>
